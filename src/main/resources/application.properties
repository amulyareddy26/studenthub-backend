spring.application.name=studenthub
server.port=${PORT:8080}

# ---- Database: put YOUR MySQL root password after "DB_PASSWORD:" ----
spring.datasource.url=jdbc:mysql://localhost:3306/studenthub_deploy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
